version: "3.8"

services:
  # ─── Blue instance (primary) ────────────────────────────────────────────
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://aiportfolio:aiportfolio@db:5432/aiportfolio
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  # ─── Green instance (standby) ───────────────────────────────────────────
  app-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://aiportfolio:aiportfolio@db:5432/aiportfolio
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aiportfolio-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aiportfolio
      - POSTGRES_PASSWORD=aiportfolio
      - POSTGRES_DB=aiportfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiportfolio -d aiportfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ─── Certbot (auto-SSL) ────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: aiportfolio-certbot
    restart: unless-stopped
    entrypoint: >
      sh -c "
        DOMAIN=\"\$${DOMAIN:-localhost}\";
        CERT_DIR=\"/etc/letsencrypt/live/\$$DOMAIN\";

        # Generate self-signed fallback certs so nginx can start on port 443
        if [ ! -f \"\$CERT_DIR/fullchain.pem\" ]; then
          mkdir -p \"\$CERT_DIR\";
          echo 'Generating self-signed cert for bootstrapping...';
          apk add --no-cache openssl 2>/dev/null;
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout \"\$CERT_DIR/privkey.pem\" \
            -out \"\$CERT_DIR/fullchain.pem\" \
            -days 365 \
            -subj \"/CN=\$$DOMAIN\" 2>/dev/null;
          echo 'Self-signed cert created. Certbot will replace it.';
        fi;

        # Try to get real certs from Let's Encrypt
        echo 'Requesting Let'\''s Encrypt certificate for ' \$$DOMAIN '...';
        certbot certonly --webroot -w /var/www/certbot \
          -d \$$DOMAIN \
          --non-interactive \
          --agree-tos \
          --email \"admin@\$$DOMAIN\" \
          --keep-until-expiring \
          || echo 'Certbot not ready yet (DNS may not be propagated). Using self-signed.';

        # Renewal loop (runs once daily)
        trap 'exit 0' TERM;
        while true; do
          sleep 86400;
          certbot renew --non-interactive || true;
        done
      "
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - external

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aiportfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app-blue
      - app-green
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  certbot_data:
    driver: local
  certbot_www:
    driver: local
